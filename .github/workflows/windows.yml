name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          shallow-submodules: true
      - name: Check public commit identities
        shell: pwsh
        run: ./scripts/Verify-PublicIdentity.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -PackageRelease -PublicRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AionPresence-Windows
          path: |
            dist/Aion2Presence-Setup.exe
            dist/Aion2Presence.exe
            dist/SHA256SUMS.txt
            dist/Aion2Presence-Windows.zip
            dist/Aion2Presence-Source.zip
          retention-days: 30
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content AionPresence/AionPresence.csproj
          $version = $project.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release create $tag dist/Aion2Presence-Setup.exe dist/Aion2Presence.exe dist/Aion2Presence-Windows.zip dist/Aion2Presence-Source.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --prerelease --title "AION2 Presence v$version (review build ${{ github.run_number }})" --notes "Private review candidate. English / Polski. Includes license notices, matching source with pinned parser and bundled Rust dependency source archives, and fictional Discord previews in README. Game and Discord appearance still require live-session testing. Uses the maintainer-owned Discord identity. Repository visibility remains unchanged; public release is pending maintainer review. / Kandydat do przeglądu; repozytorium pozostaje prywatne."
